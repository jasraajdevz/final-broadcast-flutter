  <style>
    /* The engine takes a beat to boot. Until it does, the page must already look like
       the game — a white flash before a horror game in a dark room is the worst
       possible first frame. The shim is removed on flutter-first-frame. */
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #boot-shim{position:fixed;inset:0;display:grid;place-items:center;z-index:9;
      background:radial-gradient(120% 90% at 50% 40%,#0a0c0d 0%,#000 75%);
      font-family:"Courier New",Courier,monospace;color:#4d6164;
      letter-spacing:6px;font-size:12px;text-align:center}
    #boot-shim b{display:block;font-size:26px;letter-spacing:12px;color:#c9d6d4;
      margin-bottom:14px;font-weight:700}
    #boot-shim i{display:block;font-style:normal;margin-top:18px;font-size:10px;
      color:#33403f;animation:bs 1.6s infinite}
    @keyframes bs{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

<body>
  <div id="boot-shim">
    <div>
      <b>FINAL BROADCAST</b>
      STATION KBLK-7 &nbsp;·&nbsp; 1,140 kHz
      <i>WARMING THE TUBE</i>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('boot-shim');
      if (s) s.remove();
    });
  </script>
  <!-- ============================================================== -->
  <!-- SERVICE WORKER KILL-SWITCH                                     -->
  <!--                                                                 -->
  <!-- An earlier build of this game registered a Flutter service      -->
  <!-- worker. Once installed, a service worker is RESIDENT: it keeps  -->
  <!-- serving its own cached copy of main.dart.js forever, and        -->
  <!-- building with --pwa-strategy=none only stops NEW registrations  -->
  <!-- — it does not evict the one already sitting in the browser.     -->
  <!-- A hard reload does not reliably remove it either.               -->
  <!--                                                                 -->
  <!-- Net effect: three consecutive deploys were verified byte-for-   -->
  <!-- byte correct on the server and the player saw none of them.     -->
  <!--                                                                 -->
  <!-- This unregisters every worker, drops every cache, and reloads   -->
  <!-- exactly once (guarded by sessionStorage so it can never loop).  -->
  <!-- ============================================================== -->
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      var had = regs.length > 0;
      var jobs = regs.map(function (r) { return r.unregister(); });
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          if (ks.length) had = true;
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      return Promise.all(jobs).then(function () {
        if (had && !sessionStorage.getItem('swPurged')) {
          sessionStorage.setItem('swPurged', '1');
          location.reload();
        }
      });
    }).catch(function () {});
  })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
